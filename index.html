<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trousse HONOR</title>
<meta name="description" content="Bibliothèque de travail des promoteurs HONOR et des chefs de secteur en magasin.">
<meta name="theme-color" content="#010205">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trousse">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#010205; --surf:#0E1418; --surf2:#131a1f;
  --tx:#FAFBFF; --tx2:#9BA1A9; --line:rgba(255,255,255,.12);
  --glass:rgba(128,128,128,.23); --blur:32px;
  --ok:#46BE87; --warn:#E2A13C; --info:#5EA2EC; --red:#E0453F;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --gl:max(16px,var(--sal)); --gr:max(16px,var(--sar));
  --hdr:56px; --nav:62px; --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Archivo,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0;font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
mark{background:rgba(250,251,255,.16);color:var(--tx);border-radius:3px;padding:0 2px}
.app{max-width:520px;margin:0 auto;position:relative;min-height:100svh;overflow-x:clip}
.gut{padding-left:var(--gl);padding-right:var(--gr)}
.muted{color:var(--tx2)}
.small{font-size:13px}
.xs{font-size:12px}
.center{text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* En-tête */
.hdr{position:fixed;top:0;left:0;right:0;z-index:60;padding-top:var(--sat);background:rgba(1,2,5,.6);-webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);border-bottom:1px solid var(--line)}
.hdr-in{max-width:520px;margin:0 auto;height:var(--hdr);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 var(--gr) 0 var(--gl)}
.hdr-l{font-size:15px;justify-self:start}
.wordmark{font-size:14px;letter-spacing:.62em;padding-left:.62em;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;padding-top:6px;padding-bottom:6px}
.hdr-r{justify-self:end;display:flex;gap:8px}

/* Boutons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 22px;border-radius:4px;background:#fff;color:#000;font-size:15px;white-space:nowrap}
.btn.glass{background:var(--glass);color:var(--tx);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.round{position:relative;overflow:hidden;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));flex:none}
.round.sm{width:36px;height:36px}
.round svg,.btn svg{width:18px;height:18px}
.ripple{position:absolute;border-radius:50%;transform:scale(0);background:currentColor;opacity:.22;pointer-events:none;animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* Pilule de verre */
.pill{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border-radius:999px;padding:4px}
.pill-i{position:relative;overflow:hidden;border-radius:999px;color:var(--tx);transition:background .25s,color .25s}
.pill-i.on{background:#fff;color:#000}

/* Navigation univers */
.nav{position:fixed;z-index:55;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sab));width:min(488px,calc(100% - 32px));display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.nav .pill-i{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;line-height:1}
.nav .pill-i svg{width:19px;height:19px}
.nav.hide{display:none}

main{padding-top:calc(var(--hdr) + var(--sat));padding-bottom:calc(var(--nav) + 40px + var(--sab))}

/* Rideau et transitions */
.curtain{position:fixed;inset:0;background:#000;z-index:90;opacity:0;pointer-events:none;transition:opacity .18s ease}
.curtain.on{opacity:1}
.fade{animation:fade .24s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Statuts */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:1;padding:6px 9px;border-radius:999px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st.ok{color:var(--ok);background:rgba(70,190,135,.13)}
.st.warn{color:var(--warn);background:rgba(226,161,60,.13)}
.st.info{color:var(--info);background:rgba(94,162,236,.13)}
.tag{display:inline-flex;font-size:12px;line-height:1;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--tx2);white-space:nowrap}

/* Emplacement de contenu à reprendre */
.ph{display:inline;color:var(--tx2);border-bottom:1px dashed rgba(255,255,255,.3);font-size:.92em}
.ph-band{margin:14px var(--gr) 0 var(--gl);padding:10px 12px;border-radius:var(--r);background:var(--surf);font-size:13px;color:var(--tx2);display:flex;gap:10px;align-items:flex-start}
.ph-band svg{width:16px;height:16px;flex:none;margin-top:2px}

/* Cartes */
.card{background:var(--surf);border-radius:var(--r);position:relative;overflow:hidden}
.pad{padding:16px}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:21px;line-height:1.2}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tap{cursor:pointer;position:relative;overflow:hidden}

/* Produit */
.stage{perspective:900px;display:flex;justify-content:center;align-items:flex-end;position:relative}
.prod{position:relative;width:min(var(--mw,100%),calc(var(--h) * var(--ar)));aspect-ratio:var(--ar);margin:0 auto}
.prod .rot{position:absolute;inset:0;transform-style:preserve-3d}
.prod.spin .rot{animation:spin 6s ease-in-out infinite alternate}
@keyframes spin{from{transform:rotateY(-14deg)}to{transform:rotateY(14deg)}}
.prod svg,.prod img{width:100%;height:100%;display:block;object-fit:contain}
.prod .refl{position:absolute;left:0;right:0;top:100%;height:100%;transform:scaleY(-1);opacity:.3;-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 38%);mask-image:linear-gradient(to top,#000 0%,transparent 38%);pointer-events:none}
.halo{position:absolute;left:50%;bottom:-6%;width:120%;height:34%;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(250,251,255,.14),rgba(250,251,255,0) 70%);pointer-events:none;z-index:-1}

/* Héros accueil */
.hero{position:relative;height:calc(100svh - var(--hdr) - var(--sat));min-height:600px;max-height:900px;overflow:hidden;touch-action:pan-y}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:30px var(--gr) 0 var(--gl);opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.slide.on{opacity:1;visibility:visible;transition:opacity .7s ease}
.eyebrow{font-size:13px;color:var(--tx2)}
.h-title{font-size:clamp(30px,8.4vw,40px);line-height:1.08;text-align:center;margin-top:10px;max-width:14ch}
.h-title .w{display:inline-block;opacity:0;transform:translateY(14px)}
.slide.on .h-title .w{animation:wup .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes wup{to{opacity:1;transform:none}}
.h-hook{margin-top:12px;text-align:center;color:var(--tx2);max-width:32ch;font-size:15px}
.slide .btn{margin-top:20px}
.slide .stage{flex:1;width:100%;align-items:center;padding-bottom:calc(var(--nav) + 120px + var(--sab))}
.h-ctrl{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(var(--nav) + 30px + var(--sab));display:flex;align-items:center;gap:14px;z-index:5}
.bars{flex:1;display:flex;gap:6px}
.bars span{flex:1;height:2px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;cursor:pointer;position:relative}
.bars span::before{content:"";position:absolute;inset:-10px 0}
.bars b{display:block;height:100%;width:0;background:#fff}
.bars span.done b{width:100%}
.bars span.on b{animation:fill var(--dur,7s) linear forwards}
@keyframes fill{to{width:100%}}

/* Rail */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:0 var(--gr) 4px var(--gl);scroll-padding-left:var(--gl);scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail>.card{flex:0 0 72%;scroll-snap-align:start}
.rail .card .stage{height:170px;align-items:center;margin-bottom:18px}
.track{margin:16px var(--gr) 0 var(--gl);height:2px;background:rgba(255,255,255,.14);border-radius:2px;position:relative;overflow:hidden}
.track b{position:absolute;top:0;left:0;height:100%;background:#fff;border-radius:2px}

/* Kit */
.k-hero{padding:26px var(--gr) 0 var(--gl);text-align:center}
.k-hero .stage{height:clamp(220px,36svh,330px);margin:8px 0 54px}
.k-name{font-size:clamp(28px,8vw,36px);line-height:1.1}
.k-meta{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.k-date{margin-top:10px;font-size:12px;color:var(--tx2)}
.tabs{position:sticky;top:calc(var(--hdr) + var(--sat));z-index:40;padding:10px var(--gr) 10px var(--gl);background:linear-gradient(var(--bg) 70%,rgba(1,2,5,0))}
.tabs .pill{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;scroll-behavior:smooth}
.tabs .pill::-webkit-scrollbar{display:none}
.tabs .pill-i{flex:none;height:38px;padding:0 15px;font-size:14px;display:flex;align-items:center;white-space:nowrap}
.panel{padding:8px var(--gr) 0 var(--gl)}
.hook{font-size:22px;line-height:1.3}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.fig{padding:16px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.fig .n{font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.fig .n small{font-size:15px;color:var(--tx2);margin-left:3px}
.pts{list-style:none;padding:0;margin:0;display:grid;gap:0}
.pts li{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.pts li:last-child{border-bottom:1px solid var(--line)}
.pts .num{color:var(--tx2);font-size:13px;font-variant-numeric:tabular-nums;padding-top:2px;flex:none;width:22px}
.alert{display:flex;gap:12px;padding:14px 16px}
.alert svg{width:18px;height:18px;flex:none;margin-top:2px}
.lbl{font-size:12px;color:var(--tx2);margin-bottom:4px}

/* Accordéon */
.acc{border-top:1px solid var(--line)}
.acc:last-child{border-bottom:1px solid var(--line)}
.acc-h{width:100%;text-align:left;display:flex;align-items:flex-start;gap:12px;padding:16px 0;position:relative;overflow:hidden}
.acc-h .q{flex:1}
.acc-h svg{width:18px;height:18px;flex:none;margin-top:3px;transition:transform .25s}
.acc.open .acc-h svg{transform:rotate(45deg)}
.acc-b{display:none;padding:0 0 18px}
.acc.open .acc-b{display:block;animation:fade .24s ease both}
.step3{display:grid;gap:8px}
.step3 .card{padding:12px 14px}

/* Chrono */
.timer{display:flex;flex-direction:column;align-items:center;gap:18px;margin:6px 0 26px}
.ring{position:relative;width:184px;height:184px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:10px;justify-content:center}
.pitch{font-size:19px;line-height:1.55}
.kw{background:rgba(250,251,255,.14);border-radius:3px;padding:0 3px}

/* Plein écran */
.fs{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab)}
.fs.in{animation:fade .24s ease both}
.fs-top{display:flex;align-items:center;gap:12px;padding:10px var(--gr) 8px var(--gl);max-width:520px;width:100%;margin:0 auto}
.fs-prog{display:flex;gap:5px;padding:4px var(--gr) 0 var(--gl);max-width:520px;width:100%;margin:0 auto}
.fs-prog span{flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.18)}
.fs-prog span.on{background:#fff}
.fs-body{flex:1;overflow-y:auto;padding:24px var(--gr) 24px var(--gl);max-width:520px;width:100%;margin:0 auto;-webkit-overflow-scrolling:touch}
.fs-bot{display:flex;align-items:center;gap:10px;padding:10px var(--gr) 14px var(--gl);max-width:520px;width:100%;margin:0 auto}
.fs-bot .btn{flex:1}
.fs h2{font-size:26px;line-height:1.2}
.tip{margin-top:22px;padding:14px 16px;border-radius:var(--r);background:var(--surf)}
.tip .lbl{display:flex;align-items:center;gap:8px}
.tip .lbl svg{width:15px;height:15px}

/* Quiz */
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:var(--r);background:var(--surf);display:flex;gap:12px;align-items:flex-start;position:relative;overflow:hidden;transition:background .2s}
.opt .k{color:var(--tx2);flex:none;width:18px}
.opt.good{background:rgba(70,190,135,.16)}
.opt.bad{background:rgba(224,69,63,.16)}
.opt[disabled]{cursor:default}

/* Fiche */
.spec{display:grid;grid-template-columns:minmax(96px,38%) 1fr;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line)}
.spec:last-of-type{border-bottom:1px solid var(--line)}
.spec .v{display:grid;gap:8px;justify-items:start;min-width:0;overflow-wrap:anywhere}
.src{display:flex;align-items:center;gap:10px;padding:12px 14px;text-decoration:none}
.src svg{width:16px;height:16px;flex:none}

/* Recherche */
.sbox{position:sticky;top:calc(var(--hdr) + var(--sat));z-index:40;padding:12px var(--gr) 12px var(--gl);background:var(--bg)}
.sbox label{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur))}
.sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px}
.sbox input::placeholder{color:var(--tx2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;overflow:hidden;height:36px;padding:0 14px;border-radius:999px;background:var(--glass);font-size:14px;display:inline-flex;align-items:center}
.chip.on{background:#fff;color:#000}

/* Onboarding */
.onb{min-height:100svh;padding:calc(40px + var(--sat)) var(--gr) calc(30px + var(--sab)) var(--gl);display:flex;flex-direction:column}
.onb h1{font-size:30px;line-height:1.15;text-align:center}

/* Intro */
.intro{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease}
.intro.out{opacity:0;pointer-events:none}
.intro .wm{display:flex;gap:.55em;font-size:30px;letter-spacing:0}
.intro .wm span{display:inline-block;opacity:0;transform:translateY(26px);animation:wup .8s cubic-bezier(.2,.7,.2,1) forwards}
.intro .ln{width:180px;height:1px;background:rgba(255,255,255,.6);margin-top:22px;transform:scaleX(0);animation:ln 1s cubic-bezier(.6,0,.2,1) .7s forwards}
@keyframes ln{to{transform:scaleX(1)}}

/* Pilotage */
.demo-flag{background:var(--red);color:#fff;text-align:center;font-size:13px;padding:8px 12px;border-radius:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:14px}
.kpi .n{font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:92px 1fr 34px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.hbar .b{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.hbar .b i{display:block;height:100%;background:#fff;border-radius:3px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th{font-weight:400;color:var(--tx2);text-align:right;padding:8px 4px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:10px 4px;border-bottom:1px solid var(--line)}
.pad-keys{display:grid;grid-template-columns:repeat(3,72px);gap:16px;justify-content:center;margin-top:30px}
.pad-keys .round{width:72px;height:72px;font-size:24px}
.dots{display:flex;gap:16px;justify-content:center;margin-top:26px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
.dots i.on{background:#fff;border-color:#fff}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .h-title .w,.intro .wm span{opacity:1!important;transform:none!important}
  .intro .ln{transform:none!important}
  .bars span.on b{width:100%}
  .prod .rot{transform:rotateY(-8deg)}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr" id="hdr">
    <div class="hdr-in">
      <a class="hdr-l" href="#/" style="text-decoration:none">Trousse</a>
      <div class="wordmark" id="logo" aria-label="HONOR">HONOR</div>
      <div class="hdr-r">
        <a class="round sm" href="#/recherche" aria-label="Rechercher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></a>
        <a class="round sm" href="#/profil" aria-label="Profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></svg></a>
      </div>
    </div>
  </header>
  <main id="view"></main>
  <nav class="nav pill" id="nav" aria-label="Univers"></nav>
</div>
<div class="curtain" id="curtain"></div>
<div id="layer"></div>

<script>
'use strict';
/* =====================================================================
   RÉGLAGES
   adminCode : code d'accès à l'espace pilotage (à changer avant diffusion).
   endpoint  : URL qui reçoit les événements (POST JSON). null = suivi local
               uniquement, sur l'appareil.
   ===================================================================== */
const CONFIG = { adminCode: '2026', endpoint: null, version: 'Coquille 0.1' };

/* =====================================================================
   CONTENU
   Cette version est une coquille. Les textes, prix, dates, statuts,
   sources, contradictions et visuels sont à reprendre de
   trousse-honor.html et HONOR_one-pagers_interactif.html.
   Tout champ laissé à null s'affiche « À reprendre ».

   Format d'un kit (tous les champs sont facultatifs sauf id, name, univers) :
   {
     id, name, univers, family, type: 'phone'|'fold'|'tablet'|'laptop'|'watch'|'buds'|'service',
     variant, img: 'visuels/visuel-01.webp', imgAr: .57,   // visuel officiel détouré et son ratio largeur/hauteur
     status: 'verified'|'confirm'|'announced',
     price: '1 999 €', priceDate: '12/10/2026', releaseFR: '…',
     hook: '…',
     figures: [{ value: 5000, unit: 'mAh', label: '…' }],       // 4
     points: ['…'],                                              // 5
     alerts: ['…'],
     modules: [{ id, title, screens: [{ title, text, tip }] }],
     demo: [{ title, accroche, preuve, benefice, action }],
     pitch: { text: '…', keywords: ['…'] },
     objections: [{ id, q, usage, preuve, montrer }],
     quiz: [{ q, options: ['…'], answer: 0, explain: '…' }],
     faq: [{ id, q, a, src }],
     specs: [{ label, value, status, src }],
     contradictions: [{ topic, a, b }],
     sources: [{ label, url, note }],
     videos: [{ id, title, channel, url }]   // liens YouTube externes, chaînes HONOR officielles

/* Normalisation sans accents, avec table de correspondance pour le surlignage */
function normMap(s){
  let out = '', map = [];
  for (let i = 0; i < s.length; i++){
    const n = s[i].normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    for (let j = 0; j < n.length; j++){ out += n[j]; map.push(i); }
  }
  return { out, map };
}
const norm = s => normMap(String(s || '')).out.replace(/\s+/g, ' ').trim();
function highlight(text, tokens){
  text = String(text || '');
  const { out, map } = normMap(text);
  const marks = new Array(text.length).fill(false);
  tokens.forEach(t => {
    if (!t) return;
    let p = out.indexOf(t);
    while (p !== -1){
      for (let k = p; k < p + t.length; k++) marks[map[k]] = true;
      p = out.indexOf(t, p + t.length);
    }
  });
  let h = '', open = false;
  for (let i = 0; i < text.length; i++){
    if (marks[i] && !open){ h += '<mark>'; open = true; }
    if (!marks[i] && open){ h += '</mark>'; open = false; }
    h += esc(text[i]);
  }
  return h + (open ? '</mark>' : '');
}

function track(type, data = {}){
  const p = getProfile() || {};
  const ev = Object.assign({ t: Date.now(), type, dev: deviceId(), enseigne: p.enseigne || null, role: p.role || null }, data);
  const all = store.get('events', []);
  all.push(ev);
  if (all.length > 5000) all.splice(0, all.length - 5000);
  store.set('events', all);
  if (CONFIG.endpoint){
    try {
      const body = JSON.stringify(ev);
      if (!(navigator.sendBeacon && navigator.sendBeacon(CONFIG.endpoint, new Blob([body], { type:'application/json' }))))
        fetch(CONFIG.endpoint, { method:'POST', body, headers:{ 'Content-Type':'application/json' }, keepalive:true }).catch(() => {});
    } catch(e){}
  }
}

/* =====================================================================
   ÉTAT ET NAVIGATION
   ===================================================================== */
const state = { route:null, heroTimer:null, heroIdx:0, cleanup:[] };
function parseRoute(){
  const h = (location.hash || '#/').replace(/^#/, '');
  if (h === 'admin') return { name:'admin' };
  const p = h.split('/').filter(Boolean);
  if (!p.length) return { name:'home' };
  if (p[0] === 'u' && UNI[p[1]]) return { name:'univers', id:p[1] };
  if (p[0] === 'k' && KIT[p[1]]) return { name:'kit', id:p[1], tab: TABS.some(t => t[0] === p[2]) ? p[2] : 'essentiel' };
  if (p[0] === 'recherche') return { name:'search' };
  if (p[0] === 'profil') return { name:'profil' };
  return { name:'home' };
}
function go(hash){ if (location.hash === hash) onRoute(); else location.hash = hash; }

function renderNav(active){
  const nav = $('#nav');
  nav.innerHTML = UNIVERS.map(u => `<a class="pill-i${u.id === active ? ' on' : ''}" href="#/u/${u.id}" aria-label="${esc(u.name)}">${I[u.id]}<span>${esc(u.short)}</span></a>`).join('');
}

function cleanup(){ state.cleanup.forEach(f => { try { f(); } catch(e){} }); state.cleanup = []; }

let first = true;
function onRoute(){
  const r = parseRoute();
  if (r.name === 'admin'){
    const back = state.route ? routeHash(state.route) : '#/';
    history.replaceState(null, '', back);
    if (!state.route) onRoute();
    openAdminGate();
    return;
  }
  const prev = state.route;
  const sameKit = prev && prev.name === 'kit' && r.name === 'kit' && prev.id === r.id;
  state.route = r;
  if (sameKit){ setTab(r.tab, false); return; }
  if (!getProfile()){ renderOnboarding(); return; }
  const draw = () => {
    cleanup();
    closeLayer(true);
    $('#hdr').style.display = '';
    renderNav(r.name === 'univers' ? r.id : r.name === 'kit' ? KIT[r.id].univers : null);
    $('#nav').classList.toggle('hide', r.name === 'search');
    const v = $('#view');
    if (r.name === 'home') renderHome(v);
    else if (r.name === 'univers') renderUnivers(v, r.id);
    else if (r.name === 'kit') renderKit(v, r.id, r.tab);
    else if (r.name === 'search') renderSearch(v);
    else if (r.name === 'profil') renderProfil(v);
    window.scrollTo(0, 0);
    countUp();
  };
  if (first || reduced()){ first = false; draw(); return; }
  const c = $('#curtain');
  c.classList.add('on');
  setTimeout(() => { draw(); requestAnimationFrame(() => c.classList.remove('on')); }, 190);
}
function routeHash(r){
  if (r.name === 'univers') return '#/u/' + r.id;
  if (r.name === 'kit') return `#/k/${r.id}/${r.tab}`;
  if (r.name === 'search') return '#/recherche';
  if (r.name === 'profil') return '#/profil';
  return '#/';
}

    </div>
  </section>

  <section class="sec">
    <div class="sec-h gut"><h2>Par univers</h2><span class="muted small" id="railCount">01 / ${String(UNIVERS.length).padStart(2, '0')}</span></div>
    <div class="rail" id="rail">
      ${UNIVERS.map(u => { const kits = KITS.filter(k => k.univers === u.id), gam = GAMME.filter(g => g.univers === u.id); const k = KIT[u.phare];
        return `<a class="card pad tap" href="#/u/${u.id}" style="text-decoration:none">
          <div class="stage">${visual(k, 150, { spin:false, mw:'86%' })}</div>

    </div>
    <div class="track"><b id="railThumb"></b></div>
  </section>

  <section class="sec gut">
    <div class="sec-h"><h2>Reprendre</h2></div>
    ${recent.length ? `<div class="list">${recent.map(r => { const k = KIT[r.id]; const tab = TABS.find(t => t[0] === r.tab) || TABS[0];
      return `<a class="card tap row" href="#/k/${k.id}/${tab[0]}" style="text-decoration:none;padding:12px 16px 12px 10px">
        <div style="width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex:none">${visual(k, 52, { spin:false })}</div>
        <div class="grow"><div class="ell">${esc(k.name)}</div><div class="muted small">${esc(tab[1])}</div></div>${I.right.replace('<svg', '<svg width="18" height="18"')}
      </a>`; }).join('')}</div>`
      : `<div class="card pad muted small">Les kits que vous ouvrez apparaîtront ici.</div>`}
  </section>

  <section class="sec gut">
    <div class="sec-h"><h2>Les statuts</h2></div>
    <div class="list">${Object.keys(STATUS).map(s => `<div class="card pad"><div>${stChip(s)}</div><p class="muted small" style="margin-top:10px">${STATUS[s].desc}</p></div>`).join('')}</div>
    <p class="muted xs" style="margin-top:14px">Aucun produit n’est « étanche » : on indique la certification IP, et cette protection n’est pas permanente.</p>
  </section>
  <p class="muted xs center" style="margin-top:36px">${esc(CONFIG.version)}</p>`;

  // Carrousel
  const slides = $$('.slide', v), bars = $$('.bars span', v), hero = $('#hero');
  const DUR = 7000;
  const show = i => {
    state.heroIdx = (i + slides.length) % slides.length;
    slides.forEach((s, j) => { const on = j === state.heroIdx; s.classList.toggle('on', on); s.setAttribute('aria-hidden', !on); });
    bars.forEach((b, j) => { b.classList.remove('on'); b.classList.toggle('done', j < state.heroIdx); });
    void hero.offsetWidth;
    bars[state.heroIdx].classList.add('on');
    clearTimeout(state.heroTimer);
    if (!reduced()) state.heroTimer = setTimeout(() => show(state.heroIdx + 1), DUR);
  };
  hero.style.setProperty('--dur', DUR + 'ms');
  state.heroShow = show;
  show(0);
  let sx = null, sy = null;
  hero.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive:true });
  hero.addEventListener('touchend', e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) show(state.heroIdx + (dx < 0 ? 1 : -1));
    sx = null;
  }, { passive:true });
  state.cleanup.push(() => { clearTimeout(state.heroTimer); state.heroShow = null; });

  // Rail : compteur et barre liés au défilement
  const rail = $('#rail'), thumb = $('#railThumb'), count = $('#railCount');
  const sync = () => {
    const max = rail.scrollWidth - rail.clientWidth;
    const frac = max > 0 ? rail.scrollLeft / max : 0;
    const tw = thumb.parentElement.clientWidth, w = Math.max(24, tw * rail.clientWidth / rail.scrollWidth);
    thumb.style.width = w + 'px';
    thumb.style.transform = `translateX(${frac * (tw - w)}px)`;
    const card = rail.children[0], step = card ? card.getBoundingClientRect().width + 12 : 1;
    const idx = frac >= .995 ? rail.children.length : Math.min(rail.children.length, Math.round(rail.scrollLeft / step) + 1);
    count.textContent = `${String(idx).padStart(2, '0')} / ${String(rail.children.length).padStart(2, '0')}`;
  };
  rail.addEventListener('scroll', sync, { passive:true });
  window.addEventListener('resize', sync);
  state.cleanup.push(() => window.removeEventListener('resize', sync));
  requestAnimationFrame(sync);
}

  const act = $(`#tabs [data-tab="${tab}"]`), pill = $('#tabs');
  if (act && pill){ const l = act.offsetLeft - (pill.clientWidth - act.offsetWidth) / 2; pill.scrollTo({ left:l, behavior: initial || reduced() ? 'auto' : 'smooth' }); }
  if (!initial){
    history.replaceState(null, '', `#/k/${k.id}/${tab}`);

  panel.innerHTML = `<div class="fade">${TABRENDER[tab](k)}</div>`;

/* Chiffres qui défilent */
let io;
function countUp(){
  const els = $$('.count:not([data-done])');
  if (!els.length) return;
  const run = el => {
    el.dataset.done = 1;
    const to = parseFloat(el.dataset.to), dec = (String(el.dataset.to).split('.')[1] || '').length;
    const fmt = n => n.toLocaleString('fr-FR', { minimumFractionDigits:dec, maximumFractionDigits:dec });
    if (reduced()){ el.textContent = fmt(to); return; }
    const t0 = performance.now(), d = 1200;
    const step = t => { const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  if (!('IntersectionObserver' in window)){ els.forEach(run); return; }
  io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ io.unobserve(e.target); run(e.target); } }), { threshold:.4 });
  els.forEach(el => io.observe(el));
}

/* Pitch : chrono circulaire */
const pitch = { left:30, running:false, raf:null, last:0 };
function paintPitch(){
  const arc = $('#ringArc'), t = $('#ringT');
  if (!arc) return;
  arc.setAttribute('stroke-dashoffset', 578.05 * (1 - pitch.left / 30));
  t.textContent = Math.ceil(pitch.left);
  const b = $('#pitchGo');
  if (b) b.innerHTML = pitch.running ? `${I.pause}<span>Pause</span>` : `${I.play}<span>${pitch.left < 30 && pitch.left > 0 ? 'Reprendre' : 'Démarrer'}</span>`;
}
function tickPitch(t){
  if (!pitch.running) return;
  pitch.left = Math.max(0, pitch.left - (t - pitch.last) / 1000);
  pitch.last = t;
  if (pitch.left <= 0){ pitch.running = false; pitch.left = 0; paintPitch(); return; }
  paintPitch();
  pitch.raf = requestAnimationFrame(tickPitch);
}
function stopPitch(){ pitch.running = false; cancelAnimationFrame(pitch.raf); pitch.left = 30; }

let INDEX = null;
function buildIndex(){
  const idx = [];
  const add = (type, title, text, href, extra) => idx.push(Object.assign({ type, title, text: text || '', href, n: norm(title + ' ' + (text || '')) }, extra || {}));
  KITS.forEach(k => {
    const u = UNI[k.univers].name;
    add('Kits', k.name, [u, k.family, k.hook].filter(has).join(' · '), `#/k/${k.id}`);
    add('Démos', `Démo guidée · ${k.name}`, k.demo.map(s => s.title).filter(has).join(' · '), `#/k/${k.id}/demo`);
    k.faq.forEach((f, i) => add('FAQ', has(f.q) ? f.q : `Question ${i + 1} (à reprendre)`, `${k.name}${has(f.a) ? ' · ' + f.a : ''}`, `#/k/${k.id}/faq`));
    k.objections.forEach((o, i) => add('Objections', has(o.q) ? o.q : `Objection ${i + 1} (à reprendre)`, `${k.name}${has(o.usage) ? ' · ' + o.usage : ''}`, `#/k/${k.id}/objections`));
    k.specs.forEach(s => add('Fiches', `${s.label} · ${k.name}`, has(s.value) ? s.value : 'Valeur à reprendre', `#/k/${k.id}/fiche`));
  });
  GAMME.forEach(g => add('Gamme', g.name, `${UNI[g.univers].name} · Kit à construire`, `#/u/${g.univers}`));
  UNIVERS.forEach(u => add('Univers', u.name, u.families, `#/u/${u.id}`));
  return idx;
}
const GROUPS = ['Kits','Univers','Gamme','Démos','Fiches','FAQ','Objections'];
function searchRun(q){
  INDEX = INDEX || buildIndex();
  const toks = norm(q).split(' ').filter(Boolean);
  if (!toks.length) return { toks, res:[] };
  const res = INDEX.filter(it => toks.every(t => it.n.includes(t)))
    .map(it => ({ it, s: (norm(it.title).startsWith(toks[0]) ? 3 : 0) + (norm(it.title).includes(toks.join(' ')) ? 2 : 0) }))
    .sort((a, b) => b.s - a.s).map(x => x.it);
  return { toks, res };
}
function renderSearch(v){
  const recents = store.get('searches', []);
  v.innerHTML = `<div class="sbox"><label>${I.search.replace('<svg', '<svg width="18" height="18"')}<input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Produit, question, objection…" aria-label="Rechercher"></label></div>
    <div class="gut" id="sres"></div>`;
  const input = $('#q'), out = $('#sres');
  let timer = null, lastLogged = '';
  const logIt = (q, n) => {
    const nq = norm(q);
    if (nq.length < 2 || nq === lastLogged) return;
    lastLogged = nq;
    track('search', { q:nq, n });
    const r = store.get('searches', []).filter(x => x !== q.trim());
    r.unshift(q.trim()); store.set('searches', r.slice(0, 6));
  };
  const paint = () => {
    const q = input.value;
    clearTimeout(timer);
    if (!norm(q)){
      out.innerHTML = `<div class="fade" style="padding-top:8px">
        ${recents.length ? `<div class="lbl">Recherches récentes</div><div class="chips" style="margin:8px 0 24px">${recents.map(r => `<button class="chip" data-sugg="${esc(r)}">${esc(r)}</button>`).join('')}</div>` : ''}
        <div class="lbl">Suggestions</div><div class="chips" style="margin-top:8px">${KITS.map(k => `<button class="chip" data-sugg="${esc(k.name.replace('HONOR ', ''))}">${esc(k.name.replace('HONOR ', ''))}</button>`).join('')}</div>
        <p class="muted xs" style="margin-top:22px">Recherche dans les kits, la FAQ, les objections, les fiches, les démos et la gamme. Les accents ne comptent pas.</p></div>`;
      return;
    }
    const { toks, res } = searchRun(q);
    const tq = toks.join(' ');
    const sugg = KITS.map(k => k.name).concat(GAMME.map(g => g.name)).filter(n => norm(n).includes(tq) && norm(n) !== tq).slice(0, 4);
    let h = `<div class="fade">`;
    if (sugg.length) h += `<div class="chips" style="margin:4px 0 18px">${sugg.map(s => `<button class="chip" data-sugg="${esc(s)}">${highlight(s, toks)}</button>`).join('')}</div>`;
    h += `<p class="muted small" style="margin:4px 0 12px">${res.length} résultat${res.length > 1 ? 's' : ''}</p>`;
    if (!res.length) h += `<div class="card pad"><div>Aucun résultat pour « ${esc(q.trim())} ».</div><p class="muted small" style="margin-top:6px">Essayez un nom de produit plus court, par exemple « V6 » ou « MagicPad ».</p></div>`;
    GROUPS.forEach(g => {
      const items = res.filter(r => r.type === g);
      if (!items.length) return;
      h += `<section style="margin-bottom:22px"><div class="lbl" style="margin-bottom:8px">${g} · ${items.length}</div><div class="list">${items.slice(0, 6).map(it => `<a class="card tap pad" href="${it.href}" style="display:block;text-decoration:none"><div>${highlight(it.title, toks)}</div>${it.text ? `<div class="muted small" style="margin-top:4px">${highlight(it.text.slice(0, 140), toks)}</div>` : ''}</a>`).join('')}</div></section>`;
    });
    out.innerHTML = h + '</div>';
    timer = setTimeout(() => logIt(q, res.length), 900);
  };
  input.addEventListener('input', paint);
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ const r = searchRun(input.value); logIt(input.value, r.res.length); input.blur(); } });
  out.addEventListener('click', e => {
    const s = e.target.closest('[data-sugg]');
    if (s){ input.value = s.dataset.sugg; paint(); }
    const a = e.target.closest('a[href]');
    if (a){ const r = searchRun(input.value); logIt(input.value, r.res.length); }
  });
  state.cleanup.push(() => clearTimeout(timer));
  paint();
  setTimeout(() => input.focus(), 250);
}

function rng(seed){ return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
function sampleEvents(){
  const r = rng(42), now = Date.now(), ev = [];
  const weights = [6, 9, 8, 7, 5, 3, 2];
  const devs = [];
  ENSEIGNES.forEach((e, i) => { for (let j = 0; j < weights[i]; j++) devs.push({ dev:`s-${i}-${j}`, enseigne:e, role: r() < .8 ? 'Promoteur' : 'Chef de secteur' }); });
  const kitW = KITS.map((k, i) => ({ k, w: i === 0 ? 10 : Math.max(1, 7 - i) }));
  const pickKit = () => { let t = kitW.reduce((a, b) => a + b.w, 0) * r(); for (const x of kitW){ t -= x.w; if (t <= 0) return x.k; } return KITS[0]; };
  const qs = [['batterie',4],['pliable',3],['prix v6',2],['charnière',2],['clone',1],['ip68',1],['garantie',3],['stylet',1],['magicbook',2],['coque',0],['comparatif',0],['echange reprise',0]];
  devs.forEach(d => {
    if (r() < .15) return;
    const n = 3 + Math.floor(r() * 18);
    for (let i = 0; i < n; i++){
      const t = now - Math.floor(r() * 7 * 864e5), k = pickKit(), base = { t, dev:d.dev, enseigne:d.enseigne, role:d.role, kit:k.id };
      ev.push(Object.assign({ type:'kit_open' }, base));
      const x = r();
      if (x < .35){ ev.push(Object.assign({ type:'demo_start' }, base)); ev.push(Object.assign({ type: r() < .64 ? 'demo_done' : 'demo_quit' }, base)); }
      else if (x < .55){ const s = Math.floor(r() * 4); ev.push(Object.assign({ type:'quiz', score:s, total:3, pct:Math.round(Math.min(s, 3) / 3 * 100) }, base)); }
      else if (x < .7) ev.push(Object.assign({ type:'faq_read', faq:k.faq[Math.floor(r() * 2)].id }, base));
      else if (x < .8) ev.push(Object.assign({ type:'module_open', module:k.modules[0].id }, base));
      else if (x < .86) ev.push(Object.assign({ type:'video_open', video:k.videos[0].id }, base));
      else { const q = qs[Math.floor(r() * qs.length)]; ev.push(Object.assign({ type:'search', q:q[0], n:q[1] }, base)); }
    }
  });
  return ev;
}
function computeStats(ev){
  const now = Date.now(), wk = ev.filter(e => e.t > now - 7 * 864e5);
  const devs = new Set(wk.map(e => e.dev));
  const opens = wk.filter(e => e.type === 'kit_open');
  const ds = wk.filter(e => e.type === 'demo_start').length, dd = wk.filter(e => e.type === 'demo_done').length;
  const qz = wk.filter(e => e.type === 'quiz');
  const avgQ = qz.length ? Math.round(qz.reduce((a, b) => a + (b.pct || 0), 0) / qz.length) : null;
  const byEns = ENSEIGNES.map(e => ({ e, n: new Set(wk.filter(x => x.enseigne === e).map(x => x.dev)).size }));
  const byKit = KITS.map(k => {
    const ke = wk.filter(e => e.kit === k.id), q = ke.filter(e => e.type === 'quiz');
    const s = ke.filter(e => e.type === 'demo_start').length, d = ke.filter(e => e.type === 'demo_done').length;
    return { k, opens: ke.filter(e => e.type === 'kit_open').length, demos: s, rate: s ? Math.round(d / s * 100) : null, quiz: q.length ? Math.round(q.reduce((a, b) => a + (b.pct || 0), 0) / q.length) : null };
  }).sort((a, b) => b.opens - a.opens);
  const seen = new Set(ev.flatMap(e => [e.module, e.faq, e.video]).filter(Boolean));
  const dormant = [];
  KITS.forEach(k => {
    k.modules.forEach((m, i) => { if (!seen.has(m.id)) dormant.push({ kind:'Module', label:`${k.name} · module ${i + 1}` }); });
    k.faq.forEach((f, i) => { if (!seen.has(f.id)) dormant.push({ kind:'FAQ', label:`${k.name} · question ${i + 1}` }); });
    k.videos.forEach((v, i) => { if (!seen.has(v.id)) dormant.push({ kind:'Vidéo', label:`${k.name} · vidéo ${i + 1}` }); });
  });
  const sq = {}, zero = {};
  wk.filter(e => e.type === 'search').forEach(e => { sq[e.q] = (sq[e.q] || 0) + 1; if (!e.n) zero[e.q] = (zero[e.q] || 0) + 1; });
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 6);
  return { devices:devs.size, opens:opens.length, demoRate: ds ? Math.round(dd / ds * 100) : null, demos:ds, avgQ, quizN:qz.length, byEns, byKit, dormant, topSearch:top(sq), zeroSearch:top(zero) };
}
function openAdmin(mode){
  mode = mode || 'sample';
  const local = store.get('events', []);
  const s = computeStats(mode === 'sample' ? sampleEvents() : local);
  const maxE = Math.max(1, ...s.byEns.map(x => x.n));
  const fs = $('#layer .fs') || openLayer('');
  fs.innerHTML = `<div class="fs-top"><button class="round" data-act="close" aria-label="Fermer">${I.close}</button><div class="grow">Espace pilotage</div><span class="muted xs">7 derniers jours</span></div>
  <div class="fs-body" style="padding-top:8px"><div class="fade">
    <div class="pill" style="display:grid;grid-template-columns:1fr 1fr;gap:2px"><button class="pill-i${mode === 'sample' ? ' on' : ''}" data-mode="sample" style="height:38px">Exemple</button><button class="pill-i${mode === 'local' ? ' on' : ''}" data-mode="local" style="height:38px">Cet appareil</button></div>
    ${mode === 'sample' ? '<div class="demo-flag" style="margin-top:14px">Données d’exemple</div>' : `<p class="muted xs" style="margin-top:14px">${local.length} événement${local.length > 1 ? 's' : ''} enregistré${local.length > 1 ? 's' : ''} sur cet appareil. ${CONFIG.endpoint ? 'Envoi vers le point de collecte actif.' : 'Aucun point de collecte branché : les autres appareils ne remontent pas ici.'}</p>`}
    <div class="kpis" style="margin-top:16px">
      <div class="card kpi"><div class="n">${s.devices}</div><div class="muted xs">Appareils actifs sur 7 jours</div></div>
      <div class="card kpi"><div class="n">${s.opens}</div><div class="muted xs">Kits ouverts</div></div>
      <div class="card kpi"><div class="n">${s.demoRate == null ? '–' : s.demoRate + ' %'}</div><div class="muted xs">Démos finies (${s.demos} lancées)</div></div>
      <div class="card kpi"><div class="n">${s.avgQ == null ? '–' : s.avgQ + ' %'}</div><div class="muted xs">Score moyen aux quiz (${s.quizN})</div></div>
    </div>
    <section class="sec"><div class="sec-h"><h2>Adoption par enseigne</h2><span class="muted xs">appareils</span></div>
      ${s.byEns.map(x => `<div class="hbar"><span class="ell">${esc(x.e)}</span><span class="b"><i style="width:${x.n / maxE * 100}%"></i></span><span style="text-align:right">${x.n}</span></div>`).join('')}</section>
    <section class="sec"><div class="sec-h"><h2>Par kit</h2></div>
      <table class="tbl"><thead><tr><th>Kit</th><th>Ouv.</th><th>Démos</th><th>Finies</th><th>Quiz</th></tr></thead><tbody>
      ${s.byKit.map(x => `<tr><td>${esc(x.k.name.replace('HONOR ', ''))}</td><td>${x.opens}</td><td>${x.demos}</td><td>${x.rate == null ? '–' : x.rate + ' %'}</td><td>${x.quiz == null ? '–' : x.quiz + ' %'}</td></tr>`).join('')}</tbody></table></section>
    <section class="sec"><div class="sec-h"><h2>Contenus qui dorment</h2><span class="muted xs">${s.dormant.length} jamais ouverts</span></div>
      <div class="list">${s.dormant.slice(0, 12).map(d => `<div class="row small" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="tag">${d.kind}</span><span class="grow ell">${esc(d.label)}</span></div>`).join('') || '<p class="muted small">Tout a été ouvert au moins une fois.</p>'}
      ${s.dormant.length > 12 ? `<p class="muted xs">et ${s.dormant.length - 12} autres</p>` : ''}</div></section>
    <section class="sec"><div class="sec-h"><h2>Recherches fréquentes</h2></div>
      ${s.topSearch.length ? s.topSearch.map(([q, n]) => `<div class="hbar"><span class="ell">${esc(q)}</span><span class="b"><i style="width:${n / s.topSearch[0][1] * 100}%"></i></span><span style="text-align:right">${n}</span></div>`).join('') : '<p class="muted small">Aucune recherche.</p>'}</section>
    <section class="sec"><div class="sec-h"><h2>Recherches sans résultat</h2></div>
      ${s.zeroSearch.length ? `<div class="chips">${s.zeroSearch.map(([q, n]) => `<span class="chip">${esc(q)} · ${n}</span>`).join('')}</div>` : '<p class="muted small">Aucune.</p>'}</section>
    <div class="list" style="margin-top:30px"><button class="btn glass block" data-act="export">Exporter les événements de cet appareil</button></div>
  </div></div>`;
  fs.onclick = e => {
    if (e.target.closest('[data-act="close"]')){ closeLayer(); return; }
    const m = e.target.closest('[data-mode]');
    if (m){ openAdmin(m.dataset.mode); fs.querySelector('.fs-body').scrollTop = 0; return; }
    if (e.target.closest('[data-act="export"]')){
      const blob = new Blob([JSON.stringify(store.get('events', []), null, 1)], { type:'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'trousse-honor-evenements.json'; document.body.appendChild(a); a.click(); a.remove();
    }
  };
}

/* Accès caché : appui long de 2 s, ou 5 touches rapides sur le logo */
(function(){
  const logo = $('#logo');
  let lp = null, taps = [];
  const start = () => { clearTimeout(lp); lp = setTimeout(() => { lp = null; taps = []; openAdminGate(); }, 2000); };
  const end = () => { if (lp){ clearTimeout(lp); lp = null; } };
  logo.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(t => logo.addEventListener(t, end));
  logo.addEventListener('contextmenu', e => e.preventDefault());
  logo.addEventListener('click', () => {
    const t = Date.now();
    taps = taps.filter(x => t - x < 1800); taps.push(t);
    if (taps.length >= 5){ taps = []; openAdminGate(); }
  });
})();

/* =====================================================================
   ACTIONS DÉLÉGUÉES, ONDE, PARALLAXE
   ===================================================================== */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn && state.kit){ setTab(tabBtn.dataset.tab); return; }
  const vid = e.target.closest('[data-video]');
  if (vid) track('video_open', { kit: state.kit && state.kit.id, video: vid.dataset.video });
  if (!a || a.closest('#layer')) return;
  const act = a.dataset.act, k = state.kit;
  if (act === 'heroNext' && state.heroShow) state.heroShow(state.heroIdx + 1);
  if (act === 'heroPrev' && state.heroShow) state.heroShow(state.heroIdx - 1);
  if (act === 'heroGo' && state.heroShow) state.heroShow(+a.dataset.i);
  if (act === 'module') openModule(k, +a.dataset.i);
  if (act === 'demo') openDemo(k);
  if (act === 'acc'){
    const acc = a.closest('.acc'), open = !acc.classList.contains('open');
    acc.classList.toggle('open', open);
    if (open && acc.dataset.obj) track('objection_read', { kit:k.id, objection:acc.dataset.obj });
    if (open && acc.dataset.faq) track('faq_read', { kit:k.id, faq:acc.dataset.faq });
  }
  if (act === 'pitchGo'){
    if (pitch.running){ pitch.running = false; cancelAnimationFrame(pitch.raf); }
    else {
      if (pitch.left <= 0) pitch.left = 30;
      if (pitch.left === 30) track('pitch', { kit:k.id });
      pitch.running = true; pitch.last = performance.now(); pitch.raf = requestAnimationFrame(tickPitch);
    }
    paintPitch();
  }
  if (act === 'pitchReset'){ stopPitch(); paintPitch(); }
  if (act === 'quizPick'){ const j = +a.dataset.j, q = k.quiz[quiz.i]; if (j === q.answer) quiz.score++; quizPaint({ pick:j }); }
  if (act === 'quizNext'){ quiz.i++; quizPaint(); }
  if (act === 'quizAgain') quizStart(k);
});

document.addEventListener('pointerdown', e => {
  if (reduced()) return;
  const b = e.target.closest('.btn,.round,.chip,.pill-i,.tap,.opt,.acc-h');
  if (!b || b.disabled) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height);
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(s);
  setTimeout(() => s.remove(), 600);
}, { passive:true });

let plxRaf = null;
window.addEventListener('scroll', () => {
  if (reduced() || plxRaf) return;
  plxRaf = requestAnimationFrame(() => {
    plxRaf = null;
    const y = window.scrollY;
    $$('.plx').forEach(el => { el.style.translate = `0 ${-Math.min(140, y * .18)}px`; });
  });
}, { passive:true });

window.addEventListener('hashchange', onRoute);
intro(() => {
  const wantAdmin = location.hash === '#admin';
  if (wantAdmin) history.replaceState(null, '', '#/');
  onRoute();
  if (wantAdmin && getProfile()) openAdminGate();
});
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
